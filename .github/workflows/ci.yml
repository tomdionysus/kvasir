#
# tools/ci.sh's steps on Debian 13, as the nodes have it: the header and format
# check; release builds on x86-64 and on arm64, as a build node builds them;
# clang with its thread-safety analysis; clang-tidy's use-after-move check; the
# fuzz targets for a minute each; the Debian package on both architectures;
# coverage to Codecov. ASan, UBSan and TSan (tools/ci.sh asan, tsan) are not
# run on every push: only before a release, or to hunt a bug (the maintainer,
# 2026-11-17).
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['TODO/**', 'docs/**', '**/*.md']

# A newer push to the same branch cancels the run it overtakes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.step }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { step: check, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: x86-64, runner: ubuntu-24.04 }
          - { step: release, arch: arm64, runner: ubuntu-24.04-arm }
          - { step: clang, arch: x86-64, runner: ubuntu-24.04 }
          - { step: tidy, arch: x86-64, runner: ubuntu-24.04 }
          - { step: fuzz, arch: x86-64, runner: ubuntu-24.04 }
    env:
      # Each fuzz target's time on a push; a release runs them longer by hand.
      KVASIR_FUZZ_SECONDS: 60
    container:
      image: debian:trixie
      # LeakSanitizer needs ptrace to stop the process's threads.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang clang-format clang-tidy cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev \
            libclang-rt-19-dev  # clang's sanitizer and libFuzzer runtimes

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: ${{ matrix.step }}
        run: tools/ci.sh ${{ matrix.step }}

  # The Debian package, on both architectures (arm64 as a build node builds it),
  # against Dannan's packages built from its tag: the tests run inside the
  # build, and lintian fails it on any error or warning.
  deb:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev lintian git ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the package's version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: deb
        run: tools/ci.sh deb

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ cmake ninja-build git ca-certificates openssl \
            libboost-dev libssl-dev libyaml-cpp-dev libgtest-dev lcov \
            curl gnupg  # Codecov's uploader verifies its own signature

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and test
        run: tools/ci.sh coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build-ci/coverage.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
